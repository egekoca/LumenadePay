[package]
name = "sorapay-settlement"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = "=27.0.6"

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
soroban-sdk = { version = "=27.0.6", features = ["testutils"] }
